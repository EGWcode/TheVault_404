<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | The Pirate Cove</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cove.css') }}">
</head>
<body>
{% include 'partials/cove_header.html' %}

<div class="checkout-page">
    <div class="checkout-header">
        <div>
            <h1>Checkout</h1>
            <p class="checkout-subtitle">Finalize your purchase</p>
        </div>
        <a href="{{ url_for('auth.view_cart') }}" class="back-link">← Back to bag</a>
    </div>

    <main class="checkout-layout-wrapper">
        <section class="checkout-form-container form-card">
            <h2 class="section-label">Buyer Details</h2>
            <div id="checkoutError" class="error-msg" style="display:none;"></div>
            <form id="checkoutForm">
                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Enter first name" autocomplete="given-name" required>
                </div>
                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter last name" autocomplete="family-name" required>
                </div>
                <div class="input-group">
                    <label for="buyerEmail">Campus Email</label>
                    <input type="email" id="buyerEmail" placeholder="student@campus.edu" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" placeholder="e.g. (123) 456-7890" autocomplete="tel" required>
                </div>
                <div class="input-group">
                    <label for="meetingLocation">Meeting Location</label>
                    <textarea id="meetingLocation" placeholder="e.g. Student Center, 1st Floor" required></textarea>
                </div>
            </form>
        </section>

        <aside class="order-summary-container form-card">
            <h2 class="section-label">Review Order</h2>
            <div id="checkoutItemsList">
                <p class="helper-text">Loading your bag...</p>
            </div>
            <div class="price-display">
                <span>Total</span>
                <span class="total-amount">$0.00</span>
            </div>
            <!-- Payment choice - Anthony Jackson 11/11/26. In person is the default; the Stripe
                 test-card option only appears when a Stripe TEST key is set (see utils/payments.py). -->
            <fieldset id="paymentChoice" class="payment-choice" style="border:none; padding:0; margin:12px 0;">
                <label style="display:block; margin-bottom:6px;">
                    <input type="radio" name="paymentMethod" value="in_person" checked>
                    Pay the seller in person at the meetup
                </label>
                <label id="stripeOption" style="display:none;">
                    <input type="radio" name="paymentMethod" value="stripe_test">
                    Card (Stripe test mode, no real money)
                </label>
            </fieldset>
            <p id="paymentNote" class="helper-text">No card is charged online. You pay the seller when you meet.</p>
            <button type="submit" id="submitCheckoutBtn" form="checkoutForm" class="primary-btn">Complete Transaction</button>
        </aside>
    </main>
</div>

<script src="{{ url_for('static', filename='js/cove_header.js') }}"></script>
<script src="{{ url_for('static', filename='js/checkout.js') }}"></script>
</body>
</html>
