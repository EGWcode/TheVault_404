<!--
    messages.html
    The Pirate Cove Campus Marketplace
    CSC 405 Sp 26'
    Created 10/20/26 for the buyer-seller messaging feature

Description:
Inbox (left) and the open conversation (right). On phones only one of the two
shows at a time. All data comes from the /api/conversations endpoints and is
rendered by messages.js, which polls for new messages every few seconds.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pirate Cove | Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/messages.css') }}">
</head>
<body>
    <div class="messages-page" id="messagesPage">

        <header class="messages-header">
            <button type="button" class="back-btn" onclick="if (document.referrer.startsWith(window.location.origin)) { history.back(); } else { window.location.href = '/storefronts'; }">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back
            </button>
            <h1 class="messages-title">Messages</h1>
        </header>

        <div class="messages-layout">

            <!-- Inbox -->
            <aside class="inbox" aria-label="Conversations">
                <ul class="inbox-list" id="inboxList"></ul>
                <p class="inbox-empty" id="inboxEmpty" hidden>
                    No messages yet. Open a storefront and tap <strong>Message seller</strong> to start a conversation.
                </p>
            </aside>

            <!-- Open conversation -->
            <section class="thread" aria-label="Conversation">
                <div class="thread-placeholder" id="threadPlaceholder">Select a conversation</div>

                <div class="thread-inner" id="threadInner" hidden>
                    <div class="thread-header">
                        <button type="button" class="thread-back" id="threadBack" aria-label="Back to conversations">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <div class="thread-heading">
                            <h2 class="thread-name" id="threadName"></h2>
                            <p class="thread-about" id="threadAbout"></p>
                        </div>
                        <a class="thread-store-link" id="threadStoreLink" href="#"><span class="link-long">View storefront</span><span class="link-short">Store</span></a>
                    </div>

                    <div class="thread-messages" id="threadMessages" aria-live="polite"></div>

                    <form class="composer" id="composer">
                        <textarea id="composerInput" class="composer-input" rows="1" maxlength="2000"
                                  placeholder="Write a message..." aria-label="Message"></textarea>
                        <button type="submit" class="composer-send" id="composerSend">Send</button>
                    </form>
                    <p class="composer-error" id="composerError" role="alert"></p>
                </div>
            </section>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/messages.js') }}"></script>
</body>
</html>
